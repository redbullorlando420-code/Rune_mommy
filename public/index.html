<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rune Mommy</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
  { "imports": { "three": "/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <p class="neon-kicker">Hwy 50 · Clermont</p>
      <h1>RUNE MOMMY</h1>
      <p class="sub">A 3D multiplayer hangout. Neon shakes, wilds, mines, docks. No account.</p>
      <form id="join-form">
        <input id="name" maxlength="16" placeholder="Display name" autocomplete="off" autofocus />
        <button type="submit">Walk in</button>
      </form>
      <p class="hint">Left-click ground to walk · Right-drag orbit · Scroll zoom · M world map</p>
    </div>
  </div>

  <canvas id="view"></canvas>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="compass"></div>
  <div id="region-pill"></div>

  <div id="hud">
    <div id="vitals">
      <div class="bar hp"><i id="hp-fill"></i><span id="hp-txt">HP</span></div>
      <div class="bar en"><i id="en-fill"></i><span id="en-txt">Energy</span></div>
      <div class="meta"><b id="gold">0</b> gold · Forage <b id="sk-f">1</b> · Combat <b id="sk-c">1</b></div>
      <div id="buffs"></div>
    </div>
    <div id="chat-wrap">
      <div id="chat-log"></div>
      <input id="chat" maxlength="160" placeholder="Chat, or /w Name hi" />
    </div>
    <div id="inv-panel">
      <h3>Pack</h3>
      <div id="inv"></div>
    </div>
  </div>

  <div id="ctx" class="hidden"></div>
  <div id="toasts"></div>
  <div id="examine" class="hidden"></div>

  <div id="shop" class="modal hidden">
    <div class="modal-card">
      <header><h2 id="shop-title"></h2><button class="x" data-close="shop">×</button></header>
      <p id="shop-blurb"></p>
      <div id="shop-stock"></div>
    </div>
  </div>

  <div id="trade" class="modal hidden">
    <div class="modal-card">
      <header><h2>Trade</h2><button class="x" data-close="trade">×</button></header>
      <div class="trade-cols">
        <div><h4 id="trade-you">You</h4><div id="trade-you-slots"></div><label>Gold <input id="trade-you-gold" type="number" min="0" value="0" /></label></div>
        <div><h4 id="trade-them">Them</h4><div id="trade-them-slots"></div><div id="trade-them-gold"></div></div>
      </div>
      <div class="trade-actions">
        <button id="trade-confirm">Confirm</button>
        <span id="trade-status"></span>
      </div>
    </div>
  </div>

  <div id="wmap" class="hidden">
    <div class="wmap-card">
      <header><h2>World Map</h2><span>press M</span></header>
      <canvas id="wmap-c" width="640" height="640"></canvas>
      <ul id="wmap-legend"></ul>
    </div>
  </div>

  <script type="module" src="/game.js"></script>
</body>
</html>
